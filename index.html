<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>蹭饭图 · 中国平面地图版</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
  <link rel="stylesheet" href="css/style-2d.css">
</head>
<body>
  <!-- 平面地图画布 -->
  <div id="map-container"></div>

  <!-- 顶部工具条 -->
  <div id="map-topbar">
    <button id="btn-back" class="btn" style="display:none">← 返回全国</button>
    <h2 id="map-title">中国 · 省级蹭饭分布</h2>
    <div class="top-actions">
      <button id="btn-add-in-province" class="btn primary" style="display:none">＋ 在该省添加蹭饭人</button>
    </div>
  </div>

  <div id="hint">🖱️ 悬停查看该地区蹭饭人 · 点击省份查看市级地图 · 滚轮/按钮缩放 · 拖拽平移</div>

  <!-- 缩放控制 -->
  <div id="zoom-controls">
    <button id="zoom-in" class="zoom-btn" title="放大">＋</button>
    <button id="zoom-out" class="zoom-btn" title="缩小">－</button>
    <button id="zoom-reset" class="zoom-btn" title="复位">⟲</button>
  </div>

  <!-- 版权标识 -->
  <div id="credit">Made by zty 2026/8/16<br>地图来源：阿里云</div>

  <!-- 侧边栏（桌面固定左侧；手机端为底部抽屉面板） -->
  <div id="sheet-backdrop"></div>
  <aside id="sidebar">
    <div class="sheet-handle" id="sheet-handle"></div>
    <header class="side-head">
      <h1>🍚 蹭饭图</h1>
      <p class="sub">中国平面地图版 · 人越多颜色越深</p>
      <button id="sheet-close" class="sheet-close" title="关闭">✕</button>
    </header>

    <div class="sheet-tabs" id="sheet-tabs">
      <button class="sheet-tab active" data-tab="stats">📊 概况</button>
      <button class="sheet-tab" data-tab="add">➕ 添加</button>
      <button class="sheet-tab" data-tab="list">📋 列表</button>
    </div>

    <!-- 概况：统计 + 图例 + 数据操作 -->
    <section class="sheet-panel active" data-panel="stats">
      <div class="stats" id="stats">
        <div class="stat"><b>0</b><span>蹭饭人</span></div>
        <div class="stat"><b>0</b><span>覆盖省份</span></div>
        <div class="stat"><b>0</b><span>省级地区</span></div>
      </div>
      <div class="legend">
        <span>少</span>
        <div class="legend-bar" id="legend-bar"></div>
        <span>多</span>
      </div>
      <div class="actions">
        <button id="btn-demo" class="chip" title="载入示例蹭饭人">🎲 示例数据</button>
        <button id="btn-clear" class="chip danger-chip" title="清空所有数据">🧹 清空</button>
        <button id="btn-export" class="chip" title="导出数据为 JSON">📤 导出</button>
        <button id="btn-import" class="chip" title="从 JSON 导入数据">📥 导入</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </section>

    <!-- 添加蹭饭人 -->
    <section class="sheet-panel" data-panel="add">
      <div class="card" id="add-card">
        <h2>➕ 添加蹭饭人</h2>
        <form id="add-form" autocomplete="off">
          <label>姓名<input id="input-name" required placeholder="例如：张三"></label>
          <label>省份<select id="input-province"><option value="">请选择省份</option></select></label>
          <label>城市<select id="input-city"><option value="">未指定城市</option></select></label>
          <label>联系方式<input id="input-contact" placeholder="微信 / 电话（可选）"></label>
          <button type="submit" class="btn primary">🗺️ 添加到地图</button>
        </form>
      </div>
    </section>

    <!-- 蹭饭人列表 -->
    <section class="sheet-panel" data-panel="list">
      <div class="card list-card">
        <h2>📋 蹭饭人列表 <span class="count" id="list-count">0 / 0</span></h2>
        <input id="search" placeholder="🔍 搜索姓名 / 地区…">
        <ul id="people-list"></ul>
      </div>
    </section>
  </aside>

  <!-- 手机端底部导航 -->
  <nav id="mobile-nav">
    <button class="mnav-btn" data-tab="stats">📊<span>概况</span></button>
    <button class="mnav-btn" data-tab="add">➕<span>添加</span></button>
    <button class="mnav-btn" data-tab="list">📋<span>列表</span></button>
  </nav>

  <!-- 悬浮提示（桌面悬停） -->
  <div id="tooltip"></div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- 区域信息弹窗（手机端点按区域时显示） -->
  <div id="region-modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" id="region-close" title="关闭">✕</button>
      <div id="region-body"></div>
      <div class="modal-actions">
        <button id="region-drill" class="btn primary" style="display:none">🗺️ 查看市级地图</button>
        <button id="region-close-btn" class="btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 人物详情弹窗 -->
  <div id="person-modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" id="btn-modal-close" title="关闭">✕</button>
      <div id="person-modal-body"></div>
      <div class="modal-actions">
        <button id="btn-modal-delete" class="btn danger">🗑️ 删除此人</button>
      </div>
    </div>
  </div>

  <script src="lib/d3.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app-2d.js"></script>
</body>
</html>
